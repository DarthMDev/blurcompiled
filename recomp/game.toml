# Experimental configuration, tied to the supplied modified installation.
# Entry is the PE/CRT entry, not a recovered gameplay symbol. No guessed hooks.
[game]
id = "blur"
name = "Blur (recompilation experiment)"
app_name = "BlurRecompExperiment"
bundle_id = "dev.blurnative.recomp.experiment"
executable = "Blur.exe"
sha256 = "dba0264b7808a5e38d99c8c162ecd71ab06a48fbc424feb1b9a3bc1bff2fbf3f"
image_base = 0x00400000
entry_point = 0x00d44515
guest_root = 'C:\Blur'
developer_exe = "../local/recomp-blur/original/Blur.exe"
windows_version = "6.1"
# The image ends above the kit's default 16 MiB heap start.
heap_base = 0x02000000

[translate]
listings = "../local/recomp-blur/repaired/Blur.exe"
globals = "globals.toml"
# Required kit field; zero disables it, with no rewritten clock reads.
animation_counter = 0
volatile_reads = []
# Pinned Blur EXE SHA dba0264b7808a5e38d99c8c162ecd71ab06a48fbc424feb1b9a3bc1bff2fbf3f:
# RVA 0x009449ce is an IAT JMP to _setjmp3; PE import and listing evidence.
# Pinned CRT SHA ed0170d3de86da33e02bfa1605eec8ff6010583481b1c530843867c1939d2185:
# export longjmp, RVA 0x00074458; see docs/STARTUP_MOVIE_PROGRESS.md.
# High confidence for entry/ABI; CRT unwind callback parity is not established.
intrinsics = { setjmp = [0x00d449ce], longjmp = [0x78594458] }
entry_points = []
native = { header = "native/startup.h", sources = ["native/startup.cpp"] }

[hooks]
# Required legacy kit macros. These are disabled sentinels, not Blur symbols.
# No original caller or object is assigned these values; built-in mods are off.
frame_clock_begin = 0xffffffff
frame_clock_wait = 0xffffffff
frame_clock_wait_clamp = 0xffffffff
frame_clock_clamp_deadline = 0
frame_clock_wait_deadline = 0
cursor_surface_ptrs = []
mouse_vtable = 0
mouse_device_ptr = 0
mouse_device_right = 0
camera = 0

[mods]
builtin = "none"

[controls]
default_layout = "hidden"
pad = "native"

[bundle]
exclude = []
